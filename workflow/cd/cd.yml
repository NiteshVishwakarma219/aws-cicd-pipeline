name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t YOUR_DOCKERHUB_USERNAME/cicd-app:latest -f docker/Dockerfile .

    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'YOUR_DOCKERHUB_USERNAME/cicd-app:latest'
        format: 'table'

    - name: Push Docker Image
      run: |
        docker push YOUR_DOCKERHUB_USERNAME/cicd-app:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          docker pull YOUR_DOCKERHUB_USERNAME/cicd-app:latest

          docker stop cicd-container || true
          docker rm cicd-container || true

          docker run -d \
            --name cicd-container \
            -p 5000:5000 \
            YOUR_DOCKERHUB_USERNAME/cicd-app:latest